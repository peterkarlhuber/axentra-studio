# Server block for Axentra Studio (nginx-unprivileged, listens on 8080).
# Snippets in /etc/nginx/axentra/ are generated at container start by
# /docker-entrypoint.d/40-axentra-studio.sh from the environment.

server {
    # IPv4 only: IPv6 is not available on every container host.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Optional reverse proxy for /v1 (only when AXENTRA_API_URL is set).
    include /etc/nginx/axentra/api-proxy.conf;

    # Runtime configuration, generated from AXENTRA_PUBLIC_API_URL.
    location = /config.json {
        include /etc/nginx/axentra/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        alias /etc/nginx/axentra/config.json;
    }

    # Content-hashed build output: cache forever.
    location /assets/ {
        include /etc/nginx/axentra/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Single-page app: unknown paths render index.html, which must never be cached.
    location / {
        include /etc/nginx/axentra/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
