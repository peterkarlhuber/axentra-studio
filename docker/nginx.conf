# Server block for Axentra Studio (nginx-unprivileged, listens on 8080).
# Snippets in /etc/nginx/axentra/ are generated at container start by
# /docker-entrypoint.d/40-axentra-studio.sh from the environment.

# Access log without query strings (security review round 4, R4-2). The first request of an
# emailed link (`/invitations/accept?token=...`, `/setup?token=...`) carries a secret in its
# query before Studio removes it from the address bar, and the /v1 proxy sees the OIDC callback
# (`?code=...&state=...`). nginx's default `combined` format logs `$request` (with the query)
# and `$http_referer`, so this format logs the path of `$request_uri` up to the first `?` only
# (not `$uri`, which becomes /index.html after the SPA fallback) and no Referer.
# Signed download links carry their token in the path (`/v1/files/download/d1.<kid>.<payload>.<mac>`,
# assessment B-01), so the token is masked: the download path as a whole, and the rest of the path
# from any segment that starts like a token (`d1.`, also percent-encoded, also after an encoded
# `/`, which nginx and the API decode). Rules are tried in order.
map $request_uri $axentra_log_path {
    "~*^/v1/+files/+download/"                                     "/v1/files/download/[redacted]";
    "~*^(?<axentra_path>[^?#]*?(?:/|%2f))(?:d|%64)(?:1|%31)(?:\.|%2e)" "${axentra_path}[redacted]";
    "~^(?<axentra_path>[^?#]*)"                                    $axentra_path;
    default                                                        "-";
}
log_format axentra_studio '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $axentra_log_path $server_protocol" '
                          '$status $body_bytes_sent "$http_user_agent"';

server {
    # IPv4 only: IPv6 is not available on every container host.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    access_log /var/log/nginx/access.log axentra_studio;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Optional reverse proxy for /v1 (only when AXENTRA_API_URL is set).
    include /etc/nginx/axentra/api-proxy.conf;

    # Runtime configuration, generated from AXENTRA_PUBLIC_API_URL.
    location = /config.json {
        include /etc/nginx/axentra/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        alias /etc/nginx/axentra/config.json;
    }

    # Content-hashed build output: cache forever.
    location /assets/ {
        include /etc/nginx/axentra/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # No source maps, even from a build made with `vite build --sourcemap` (assessment C-04).
    location ~ ^/assets/.*\.map$ {
        include /etc/nginx/axentra/security-headers.conf;
        return 404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Single-page app: unknown paths render index.html, which must never be cached.
    location / {
        include /etc/nginx/axentra/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
