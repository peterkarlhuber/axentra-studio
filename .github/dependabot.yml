# Weekly update proposals for the Docker base images (Dockerfile, pinned by tag and digest),
# npm dependencies and the GitHub Actions used by CI (pinned by commit SHA).
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
