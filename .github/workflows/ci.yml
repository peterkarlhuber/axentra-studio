name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # CI-FAST AP1: a new push to a pull request cancels the older run of that pull request. Every other run (master
  # push, schedule, dispatch, and the nightly's workflow_call, where github.workflow is "Nightly") gets its own group
  # from github.run_id, so it is never cancelled and never waits behind another run.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, i18n, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Known vulnerabilities in what ships (runtime dependencies); dev tooling is tracked in
      # docs/TODO.md.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm run help:check
      - run: npm test
      - run: npm run build

  # Studio's vendored contract (api/openapi.json, src/api/schema.d.ts) must be exactly what the
  # pinned backend commit (api/BACKEND_REF) publishes, and api/SOURCE must name that commit.
  contract:
    name: API contract matches the pinned backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read api/BACKEND_REF
        id: ref
        run: |
          sha="$(tr -d '[:space:]' < api/BACKEND_REF)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error file=api/BACKEND_REF::must be one full 40-character commit SHA, got '$sha'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out peterkarlhuber/axentra at BACKEND_REF
        id: backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: peterkarlhuber/axentra
          ref: ${{ steps.ref.outputs.sha }}
          path: .backend
          persist-credentials: false
      - name: Explain a failed backend checkout
        if: failure() && steps.backend.outcome == 'failure'
        run: |
          echo "::error::Could not check out peterkarlhuber/axentra@${{ steps.ref.outputs.sha }}. Is the commit in api/BACKEND_REF pushed to peterkarlhuber/axentra?"
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Drift check (api/openapi.json, src/api/schema.d.ts, api/SOURCE vs. BACKEND_REF)
        run: npm run api:check -- --backend .backend

  # Playwright against a real, PostgreSQL-backed Axentra at api/BACKEND_REF
  # (scripts/e2e-backend.sh: non-superuser role, all modules, first admin via setup token),
  # once per deployment model: multi-product and single-product (`--mode`).
  e2e:
    name: End-to-end (Playwright, real backend, ${{ matrix.mode }}-product)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [multi, single]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      AXENTRA_E2E_PG_URL: postgresql://postgres:pg@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read api/BACKEND_REF
        id: ref
        run: |
          sha="$(tr -d '[:space:]' < api/BACKEND_REF)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error file=api/BACKEND_REF::must be one full 40-character commit SHA, got '$sha'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out peterkarlhuber/axentra at BACKEND_REF
        id: backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: peterkarlhuber/axentra
          ref: ${{ steps.ref.outputs.sha }}
          path: .backend
          persist-credentials: false
      - name: Explain a failed backend checkout
        if: failure() && steps.backend.outcome == 'failure'
        run: |
          echo "::error::Could not check out peterkarlhuber/axentra@${{ steps.ref.outputs.sha }}. Is the commit in api/BACKEND_REF pushed to peterkarlhuber/axentra?"
          exit 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .backend/pyproject.toml
      - name: Install axentra[server] from the pinned checkout
        run: |
          python -m pip install --upgrade pip
          pip install "./.backend[server]"
          axentra --version
      - name: Backend's committed OpenAPI matches its code
        working-directory: .backend
        run: axentra openapi export --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the backend (+ worker) in ${{ matrix.mode }}-product mode and run all Playwright specs
        env:
          AXENTRA_PYTHON: python
        run: scripts/e2e-backend.sh run --backend .backend --worker --mode ${{ matrix.mode }} -- npx playwright test
      - name: Upload the Playwright report and backend logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.mode }}
          path: |
            playwright-report/
            test-results/
            .e2e-backend/run/*.log
          if-no-files-found: warn
          retention-days: 14
