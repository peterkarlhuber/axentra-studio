name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, i18n, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

  # Studio's vendored contract (api/openapi.json, src/api/schema.d.ts) must be exactly what the
  # pinned backend commit (api/BACKEND_REF) publishes, and api/SOURCE must name that commit.
  contract:
    name: API contract matches the pinned backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read api/BACKEND_REF
        id: ref
        run: |
          sha="$(tr -d '[:space:]' < api/BACKEND_REF)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error file=api/BACKEND_REF::must be one full 40-character commit SHA, got '$sha'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out peterkarlhuber/axentra at BACKEND_REF
        id: backend
        uses: actions/checkout@v4
        with:
          repository: peterkarlhuber/axentra
          ref: ${{ steps.ref.outputs.sha }}
          path: .backend
          # The repository is public today; if it becomes private, add a read-only token as the
          # secret AXENTRA_REPO_TOKEN (see docs/COMPATIBILITY.md).
          token: ${{ secrets.AXENTRA_REPO_TOKEN || github.token }}
          persist-credentials: false
      - name: Explain a failed backend checkout
        if: failure() && steps.backend.outcome == 'failure'
        run: |
          echo "::error::Could not check out peterkarlhuber/axentra@${{ steps.ref.outputs.sha }}. Either the commit in api/BACKEND_REF is not pushed, or the repository is private and the secret AXENTRA_REPO_TOKEN (read access to peterkarlhuber/axentra) is missing or invalid."
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Drift check (api/openapi.json, src/api/schema.d.ts, api/SOURCE vs. BACKEND_REF)
        run: npm run api:check -- --backend .backend

  # Playwright against a real, PostgreSQL-backed Axentra at api/BACKEND_REF
  # (scripts/e2e-backend.sh: non-superuser role, all modules, first admin via setup token).
  e2e:
    name: End-to-end (Playwright, real backend)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      AXENTRA_E2E_PG_URL: postgresql://postgres:pg@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Read api/BACKEND_REF
        id: ref
        run: |
          sha="$(tr -d '[:space:]' < api/BACKEND_REF)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error file=api/BACKEND_REF::must be one full 40-character commit SHA, got '$sha'"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out peterkarlhuber/axentra at BACKEND_REF
        id: backend
        uses: actions/checkout@v4
        with:
          repository: peterkarlhuber/axentra
          ref: ${{ steps.ref.outputs.sha }}
          path: .backend
          token: ${{ secrets.AXENTRA_REPO_TOKEN || github.token }}
          persist-credentials: false
      - name: Explain a failed backend checkout
        if: failure() && steps.backend.outcome == 'failure'
        run: |
          echo "::error::Could not check out peterkarlhuber/axentra@${{ steps.ref.outputs.sha }}. Either the commit in api/BACKEND_REF is not pushed, or the repository is private and the secret AXENTRA_REPO_TOKEN (read access to peterkarlhuber/axentra) is missing or invalid."
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .backend/pyproject.toml
      - name: Install axentra[server] from the pinned checkout
        run: |
          python -m pip install --upgrade pip
          pip install "./.backend[server]"
          axentra --version
      - name: Backend's committed OpenAPI matches its code
        working-directory: .backend
        run: axentra openapi export --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the backend (+ worker) and run all Playwright specs
        env:
          AXENTRA_PYTHON: python
        run: scripts/e2e-backend.sh run --backend .backend --worker -- npx playwright test
      - name: Upload the Playwright report and backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            .e2e-backend/run/*.log
          if-no-files-found: warn
          retention-days: 14
