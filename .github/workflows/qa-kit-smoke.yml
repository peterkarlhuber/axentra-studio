# Temporary: builds and smoke-tests the local QA test kit (qakit/) on Windows, macOS and Linux. Runs only on
# pushes to the work branch and is removed before the branch is merged. Nothing is published; the kit zips are
# kept as workflow artifacts for 7 days.
name: QA kit smoke

on:
  push:
    branches: [claude/project-thread-4bzp7p]

permissions:
  contents: read

concurrency:
  group: qa-kit-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: QA kit smoke (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            system: windows
          - os: macos-latest
            system: macos
          - os: ubuntu-latest
            system: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read api/BACKEND_REF
        id: ref
        shell: bash
        run: |
          sha="$(tr -d '[:space:]' < api/BACKEND_REF)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::api/BACKEND_REF must be one full commit SHA"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out peterkarlhuber/axentra at BACKEND_REF
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: peterkarlhuber/axentra
          ref: ${{ steps.ref.outputs.sha }}
          path: .backend
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Build Studio
        shell: bash
        run: npm ci && npm run build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build tools (uv for the axentra wheel, markdown for the documents)
        shell: bash
        run: python -m pip install "uv==0.11.32" "markdown==3.11.3"
      - name: Fetch uv and PostgreSQL (SHA-256 checked)
        shell: bash
        env:
          SYSTEM: ${{ matrix.system }}
        run: python qakit/build/fetch_tools.py "$SYSTEM" .qakit-tools
      - name: Build the kit
        shell: bash
        env:
          SYSTEM: ${{ matrix.system }}
        run: python qakit/build/build_kit.py --axentra .backend --studio-dist dist --tools .qakit-tools "$SYSTEM"
      - name: Unpack below the home folder and smoke-test (managed Python download included)
        shell: bash
        env:
          SYSTEM: ${{ matrix.system }}
        run: python qakit/build/smoke.py "qakit/build/out/AxentraStudio-QA-$SYSTEM.zip"
      - name: Keep the kit zip (7 days, repository members only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AxentraStudio-QA-${{ matrix.system }}
          path: qakit/build/out/AxentraStudio-QA-${{ matrix.system }}.zip
          retention-days: 7
